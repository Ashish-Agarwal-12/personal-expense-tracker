name: CI/CD

# Every push and pull request runs the tests.
# - Pull request that passes → Vercel *preview* deployment (link posted in the run summary).
# - Push to main that passes → Vercel *production* deployment.
# Vercel's own Git auto-deploy is turned off in vercel.json, so nothing goes live without passing tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # re-run a production deploy by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    name: Deploy to Vercel
    needs: test
    # PRs from forks don't get secrets, so only deploy PRs from this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      MONGOMS_DISABLE_POSTINSTALL: '1' # the test-only MongoDB binary isn't needed for deploys
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are not set — skipping deploy. See README → Deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: steps.secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ "$VERCEL_ENV" = production ]; then vercel build --prod --token="$VERCEL_TOKEN"; else vercel build --token="$VERCEL_TOKEN"; fi

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        run: |
          if [ "$VERCEL_ENV" = production ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"

      # Uses your public production domain; Vercel's per-deployment URLs sit behind Deployment Protection.
      - name: Health check
        if: steps.secrets.outputs.ready == 'true' && env.VERCEL_ENV == 'production' && vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 10); do
            status=$(curl -sS -o body.json -w '%{http_code}' "$APP_URL/api/health" || echo 000)
            if [ "$status" = 200 ]; then
              echo "App is healthy at $APP_URL"
              exit 0
            fi
            echo "Attempt $i: HTTP $status"
            sleep 6
          done
          # Show the server's own explanation (e.g. which setting is wrong) right in the Actions log.
          problems=$(node -e "try{const b=require('./body.json');console.log((b.setupProblems||[b.error]).join(' | '))}catch{console.log('no details')}")
          echo "::error::$APP_URL/api/health is not healthy (HTTP $status): $problems"
          exit 1
