name: CI/CD

# Every push and pull request runs the tests.
# Only a push to main that passes the tests is deployed to Render.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you re-run a deploy by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set — skipping deploy. See README → Deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Deploy triggered on Render."

      - name: Wait for the new version to be healthy
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Render takes a few minutes to build; poll the health endpoint for up to ~10 minutes.
          for i in $(seq 1 40); do
            if curl -fsS "$APP_URL/api/health" > /dev/null; then
              echo "App is healthy at $APP_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::App did not become healthy in time — check the Render logs."
          exit 1
